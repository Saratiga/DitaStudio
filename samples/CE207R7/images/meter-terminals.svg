<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <rect x="10" y="10" width="380" height="140" fill="#f7f8fa" stroke="#5b6472" stroke-width="2"/>
  <g font-family="Consolas,monospace" font-size="12" fill="#1a1c1f">
