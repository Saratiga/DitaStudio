    <rect x="330" y="90" width="40" height="40" fill="#e7eff9" stroke="#1f5fa9"/>
    <text x="350" y="114" text-anchor="middle">12</text>
  </g>
  <text x="200" y="175" font-family="Segoe UI,sans-serif" font-size="12" text-anchor="middle" fill="#5b6472">1 — фаза (Г) · 4 — нейтраль (Г) · 2,3 / 5,6 — выходные зажимы (Н)</text>
  <text x="200" y="195" font-family="Segoe UI,sans-serif" font-size="12" text-anchor="middle" fill="#1f5fa9">7,8 — импульсный выход ТМ1 · 9,10,11 — интерфейс связи (пример: RS-485)</text>
