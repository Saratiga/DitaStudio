    <text x="230" y="54" text-anchor="middle">4</text>
    <rect x="270" y="30" width="40" height="40" fill="#ffffff" stroke="#1a1c1f"/>
    <text x="290" y="54" text-anchor="middle">5</text>
    <rect x="330" y="30" width="40" height="40" fill="#ffffff" stroke="#1a1c1f"/>
    <text x="350" y="54" text-anchor="middle">6</text>

    <rect x="30" y="90" width="40" height="40" fill="#ffffff" stroke="#1a1c1f"/>
    <text x="50" y="114" text-anchor="middle">7</text>
    <rect x="90" y="90" width="40" height="40" fill="#ffffff" stroke="#1a1c1f"/>
